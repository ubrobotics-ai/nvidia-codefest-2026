# G1 hug action-policy SFT smoke config for the `action_policy_g1_hug_edge`
# experiment.
# Env: G1_HUG_ROOT, G1_HUG_STATS, BASE_CHECKPOINT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT.

[job]
task         = "vfm"
experiment   = "action_policy_g1_hug_edge"
project      = "cosmos3_action_g1"
group        = "action_sft"
name         = "action_policy_g1_hug_edge_smoke"
wandb_mode   = "disabled"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 4
data_parallel_replicate_degree = 1    # LOCAL: one 8-GPU node

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [30]
warm_up_steps = [0]

[trainer]
max_iter        = 30
logging_iter    = 1
grad_accum_iter = 1

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 1000
